<!DOCTYPE html>
<html>
<head>
  <title>DeepSeek Code Commenter</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
    textarea { width: 100%; height: 200px; font-family: monospace; padding: 10px; }
    button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0056b3; }
    #result { margin-top: 20px; padding: 10px; background: #f5f5f5; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <h1>DeepSeek Code Commenter</h1>
  <textarea id="code" placeholder="Paste your JavaScript code here (up to 10 lines)..."></textarea>
  <button onclick="getComments()">Generate Comments</button>
  <div id="result"></div>
  
  <script>
    async function getComments() {
      const code = document.getElementById('code').value;
      if (!code.trim()) return alert('Please enter some code');
      
      const lines = code.split('\n').filter(l => l.trim());
      if (lines.length > 10) return alert('Maximum 10 lines allowed');
      
      document.getElementById('result').textContent = 'Generating...';
      
      try {
        const res = await fetch('/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });

        const text = await res.text();
        console.log('Raw response:', text);
        const data = JSON.parse(text);
        document.getElementById('result').textContent = data.comments || data.error;
      } catch (err) {
        document.getElementById('result').textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
